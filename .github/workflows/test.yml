name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - run: pip install -r prototype/requirements.txt pytest httpx
      # As the image does: the server and tests load httpfs, and lock_down forbids installing it later.
      - run: python -c "import duckdb; duckdb.connect().sql('INSTALL httpfs')"
      - run: python -m pytest -q prototype/tests
